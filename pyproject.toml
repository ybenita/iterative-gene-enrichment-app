[project]
name = "iterative-enrichment"
version = "0.0.1"
description = "Iterative Gene Enrichment Analysis - A tool for gene set enrichment analysis with iterative mode and statistical benchmarking"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Maxim Kuleshov", email = "kuleshov.max.v@gmail.com" }]

# Runtime dependencies
dependencies = [  # requirements.txt is what Community Cloud installs; kept in step
    "pandas>=2.2.3,<3",
    "numpy>=1.24,<3",
    "scipy>=1.15.2,<2",
    "plotly>=6.0.1,<7",
    "pydot>=4.0.1,<5",
    "networkx>=3.5,<4",
    "streamlit>=1.48,<2",
    "Pillow>=11.1.0",
    "igraph>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest~=7.4.4",
    "isort~=6.0.1",
    "black~=25.1.0",
    "flake8~=7.3.0"
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["code", "code.ui"]
