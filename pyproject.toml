[project]
name = "iterative-enrichment"
version = "0.0.1"
description = "Iterative Gene Enrichment Analysis - A tool for gene set enrichment analysis with iterative mode and statistical benchmarking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maxim Kuleshov", email = "kuleshov.max.v@gmail.com" }]

# Runtime dependencies
dependencies = [
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "plotly>=5.18.0",
    "pydot>=2.0.0",
    "networkx>=3.1",
    "streamlit>=1.32.0",
    "Pillow>=10.0.0",
    "graphviz>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest~=7.4.4",
    "isort~=6.0.1",
    "black~=25.1.0",
    "flake8~=7.3.0"
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["code", "code.ui"]
